name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - marketplace

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin and run quality checks
        run: npm run quality

      - name: Rebuild drifted release artifacts for diagnosis
        if: failure()
        run: npm run build:artifacts

      - name: Upload drifted release artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: mcp/generated/

      - name: Install Chromium for Cowart UI tests
        run: npx playwright install --with-deps chromium

      - name: Run Cowart browser interaction tests
        run: npm run test:e2e
